<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norin Reader</title>
    <!-- Configurable endpoints for server and glyphs (override content in deployment) -->
    <meta name="server-origin" content="http://127.0.0.1:80" />
    <meta name="glyph-base" content="https://raw.githubusercontent.com/TheCyaniteProject/norin/25ac4a6a53d50d3a44acd492020c272436454b09/norin-font/glyphs" />
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --toolbar-bg: #f0f0f0;
            --panel-bg: #ffffff;
            --border: #ccc;
            --muted: rgba(0, 0, 0, 0.6);
            --link-color: #065fd4;
            --content-line: rgba(0, 0, 0, 0.06);

            /* New tuning vars */
            --glyph-tighten: -0.2em;
            --glyph-tighten-single: -0.425em;
            /* was -0.3em; much safer */
            --space-width: 0.8em;
        }

        body.dark button,
        body.dark .toolbar,
        body.dark .controls,
        body.dark .topbar,
        body.dark .reader-controls,
        body.dark .settings-bar,
        body.dark {
            --bg: #0b0f14;
            background: #0b0f14;
            background-color: #0b0f14;
            --text: #e6eef6;
            --toolbar-bg: #111417;
            --panel-bg: #0f1418;
            --border: #e6eef6;
            --muted: rgba(255, 255, 255, 0.6);
            --link-color: #7db8ff;
            --content-line: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--toolbar-bg);
            align-items: center;
        }

        /* Tabs styling */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: transparent;
            align-items: center;
        }

        .tab {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(#0000, #0000);
            cursor: pointer;
            color: var(--text);
        }

        .tab.active {
            background: var(--panel-bg);
            font-weight: 600;
        }

        .tab:not(.active) {
            opacity: 0.6;
        }

        /* Content panels sit under the tabs so give them a border that connects visually */
        #readerTab,
        #notepadTab,
        #chatTab {
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 6px 6px 6px;
            margin-top: -1px;
            padding: 0;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        button:hover {
            filter: brightness(1.06);
        }

        #status {
            color: var(--muted);
            font-size: 0.9rem;
        }

        #content {
            height: calc(100vh - 60px);
        }

        .content-inner {
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 18px;
            white-space: pre-wrap;
            line-height: 1.6;
            background: var(--panel-bg);
            color: var(--text);
            font-size: 18px;
        }

        /* Optional but helpful for mixed glyph/text rendering */
        #contentNorin,
        #notepadOutput {
            color: var(--text);
        }

        /* Glyph sizing and alignment: make SVG glyphs behave like font letters */
        .glyph-wrapper {
            display: inline-block;
            width: 1em;
            height: 1em;
            line-height: 1em;
            vertical-align: baseline;
            position: relative;
            overflow: visible;
            margin-right: var(--glyph-tighten-single);
            color: var(--text);
        }

        .glyph {
            width: 1em;
            height: 1em;
            display: block;
            overflow: visible;
        }

        /* ensure SVGs don't introduce descender space */
        .glyph-wrapper svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* force glyphs and accents to use current theme color */
        .glyph-wrapper svg,
        .glyph-wrapper svg * {
            fill: var(--text) !important;
            stroke: var(--text) !important;
        }

        .glyph-wrapper .accent,
        .glyph-wrapper .accent * {
            fill: var(--text) !important;
            stroke: var(--text) !important;
        }

        /* accent marks are absolutely positioned above the previous glyph */
        .glyph-wrapper .accent {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -0.55em;
            width: 0.9em;
            height: 0.9em;
            pointer-events: none;
            display: block;
        }

        .sinogram .sin-right .accent {
            top: -1em;
            width: 1.2em;
            height: 1.2em;
        }

        /* For sinogram 3rd character, place accent top-right (slightly to the right) for readability */
        .sinogram .sin-below .accent {
            left: 100%;
            top: -0.3em;
            width: 1em;
            height: 1em;
        }

        /* Sinogram block layout: align to baseline and position children relative to first glyph */
        .sinogram {
            display: inline-block;
            position: relative;
            width: 1.3em;
            height: 1.0em;
            vertical-align: baseline;
            margin-right: var(--glyph-tighten);
            overflow: visible;
        }

        .sinogram .sin-first {
            position: absolute;
            left: 0;
            top: 0;
            width: 1.1em;
            height: 1em;
        }

        .sinogram .sin-first .glyph {
            width: 100%;
            height: 100%;
        }

        .sinogram .sin-right {
            position: absolute;
            left: 0.8em;
            top: 0.01em;
            width: 1em;
            height: 1em;
            transform-origin: 0 0;
            transform: scale(0.5);
        }

        .sinogram .sin-below {
            position: absolute;
            left: 0.8em;
            top: 0.55em;
            width: 1em;
            height: 1em;
            transform-origin: 0 0;
            transform: scale(0.5);
        }

        /* Plain punctuation/text emitted by renderer.js */
        .literal-token {
            display: inline-block;
            width: auto;
            height: auto;
            line-height: inherit;
            vertical-align: baseline;
            margin: 0;
            padding: 0;
            color: inherit;
        }

        /*
  Punctuation tuning:
  - apostrophes should stay tight inside words: i'm, don't, we'll
  - hyphens should not look like word breaks
  - open/close punctuation gets very slight breathing room
*/
        .literal-token.punct-joiner {
            margin-left: 0;
            margin-right: 0;
        }

        .literal-token.punct-apostrophe {
            margin-left: 0.6em;
            margin-right: 0.45em;
            position: relative;
            top: -0.2em;
        }

        .literal-token.punct-hyphen {
            margin-left: 0.6em;
            margin-right: -0.15em;
            position: relative;
            top: -0.2em;
        }

        .literal-token.punct-open {
            margin-left: 0.25em;
            margin-right: -0.2em;
            position: relative;
            top: -0.25em;
        }

        .literal-token.punct-close {
            margin-left: 0.25em;
            margin-right: -0.2em;
            position: relative;
            top: -0.25em;
        }

        .literal-token.punct-neutral {
            margin-left: 0.25em;
            margin-right: -0.2em;
            position: relative;
            top: -0.2em;
        }

        /* If punctuation sits directly next to glyphs, tighten the join a bit */
        .glyph-wrapper+.literal-token.punct-apostrophe,
        .sinogram+.literal-token.punct-apostrophe {
            margin-left: 0.25em;
        }

        .literal-token.punct-apostrophe+.glyph-wrapper,
        .literal-token.punct-apostrophe+.sinogram {
            margin-left: -0.6em;
        }

        .glyph-wrapper+.literal-token.punct-hyphen,
        .sinogram+.literal-token.punct-hyphen {
            margin-left: 0.25em;
        }

        .literal-token.punct-hyphen+.glyph-wrapper,
        .literal-token.punct-hyphen+.sinogram {
            margin-left: -0.02em;
        }

        /* Optional horizontal page lines */
        #content.lines {
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.06) 1px, transparent 0);
            background-size: 100% 1.6em;
            background-position: left top;
        }

        .space {
            display: inline-block;
            width: var(--space-width);
        }

        .recent-list {
            margin-top: 12px;
        }

        .recent-link {
            display: inline-block;
            margin-right: 12px;
            color: var(--link-color);
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-size: 0.5em;
        }

        /* Exporting (PDF) view: hide toolbar, tabs and expand content to include everything */
        body.exporting .toolbar {
            display: none !important;
        }

        body.exporting .tabs {
            display: none !important;
        }

        body.exporting html,
        body.exporting body {
            height: auto !important;
            overflow: visible !important;
        }

        body.exporting #content {
            height: auto !important;
            overflow: visible !important;
        }

        /* hide scrollbars during export */
        body.exporting ::-webkit-scrollbar {
            display: none;
        }

        @media print {
            .toolbar, .tabs { display: none !important; }
            html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
            #content, .content-inner { height: auto !important; overflow: visible !important; }
        }

        .letter {
            display: inline-block;
        }

        /* switch control */
        .switch {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text);
        }

        .switch input {
            display: none;
        }

        .switch .slider {
            width: 40px;
            height: 22px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 22px;
            position: relative;
            transition: all 150ms ease;
            flex: 0 0 auto;
        }

        .switch .slider:before {
            content: '';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: all 150ms ease;
        }

        .switch input:checked+.slider {
            background: #4caf50;
        }

        /* darkmode switch-on color */
        body.dark .switch input:checked+.slider {
            background: #0b2b6b;
        }

        .switch input:checked+.slider:before {
            transform: translateX(18px);
        }

        .switch .switch-label {
            font-size: 0.95em;
        }

        /* range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 6px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            margin-top: -4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 6px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #fff;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        /* darkmode slider colors */
        body.dark input[type="range"]::-webkit-slider-runnable-track {
            background: rgba(11, 43, 107, 0.35);
        }

        body.dark input[type="range"]::-webkit-slider-thumb {
            background: #0b2b6b;
            border-color: rgba(255, 255, 255, 0.12);
        }

        body.dark input[type="range"]::-moz-range-track {
            background: rgba(11, 43, 107, 0.35);
        }

        body.dark input[type="range"]::-moz-range-thumb {
            background: #0b2b6b;
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        .loading-overlay[aria-hidden="false"] {
            display: flex;
        }

        .loading-message {
            font-size: 1.25rem;
            color: var(--text);
            display: inline-flex;
            align-items: baseline;
        }

        .loading-dots {
            display: inline-block;
            width: 3ch; /* fixed width for 0..3 dots so label doesn't shift */
            margin-left: 0.25em;
            white-space: pre; /* preserve spaces in frames */
            text-align: left;
        }

        /* Hide overlay during export and printing */
        body.exporting .loading-overlay { display: none !important; }
        @media print { .loading-overlay { display: none !important; } }
    </style>
</head>

<body>
    <div class="tabs">
        <button id="tabReader" class="tab active">Reader</button>
        <button id="tabNotepad" class="tab">Notepad</button>
        <button id="tabChat" class="tab">Chat</button>
        <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
            <label class="switch">
                <input type="checkbox" id="toggleDark">
                <span class="slider"></span>
                <span class="switch-label">Darkmode</span>
            </label>
        </div>
    </div>

    <div id="readerTab">
        <div class="toolbar">
            <div style="display:flex; align-items:center; gap:8px;">
                <button id="openBtn">Open File</button>
                <button id="exportPdfBtn">Export PDF</button>
                <div id="status" style="margin-left:8px; color: var(--muted);"></div>
            </div>
            <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
                <label class="switch">
                    <input type="checkbox" id="toggleGlyphs" checked>
                    <span class="slider"></span>
                    <span class="switch-label">Norin</span>
                </label>
                <label style="display:flex; align-items:center; gap:6px;">Size: <input id="sizeRange" type="range"
                        min="12" max="48" step="1" value="18"> <span id="sizeVal">18</span>px</label>
            </div>
        </div>
        <div id="content">
            <div id="contentLatin" class="content-inner">Open a .txt file to get started.</div>
            <div id="contentNorin" class="content-inner" style="display:none"></div>
        </div>
    </div>

    <div id="notepadTab" style="display:none; padding: 12px;">
        <div style="display:flex; flex-direction:column; gap:12px; height: calc(100vh - 84px);">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="font-weight:600;">Notepad</div>
                <div style="margin-left:auto;">
                    <label>Scale: <input id="notepadScale" type="range" min="8" max="72" step="1" value="18"> <span
                            id="notepadScaleVal">18</span>px</label>
                </div>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:12px; min-height:0;">
                <div style="flex:1; display:flex; flex-direction:column;">
                    <div style="font-weight:600; margin-bottom:6px">Input (English/Latin)</div>
                    <div id="notepadInput" contenteditable="true"
                        style="flex:1; min-height:0; border:1px solid var(--border); padding:12px; background:var(--panel-bg); color:var(--text); outline:none; overflow-y:scroll;">
                        Type here...</div>
                </div>
                <div style="flex:1; display:flex; flex-direction:column;">
                    <div style="font-weight:600; margin-bottom:6px">Converted (Norin)</div>
                    <div id="notepadOutput"
                        style="flex:1; min-height:0; border:1px solid var(--border); padding:12px; background:var(--panel-bg); color:var(--text); overflow-y:scroll;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="chatTab" style="display:none; padding:12px;">
        <div style="display:flex; flex-direction:column; gap:12px; height: calc(100vh - 84px);">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="font-weight:600;">Chat</div>
                <div id="chatStatus" style="margin-left:auto; color: var(--muted);"></div>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:12px; min-height:0;">
                <div id="chatTranscript" class="content-inner" style="flex:1; overflow-y:auto;"></div>
                <div style="display:flex; gap:8px; align-items:flex-start;">
                    <div id="chatInput" contenteditable="true"
                        style="flex:1; min-height:3.2em; max-height:10em; overflow-y:auto; border:1px solid var(--border); padding:10px; background:var(--panel-bg); color:var(--text); outline:none;">
                    </div>
                    <button id="chatSend">Send</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Global loading overlay -->
    <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
        <div class="loading-message" role="status" aria-live="polite" aria-atomic="true">
            <span class="loading-label">Loading</span><span class="loading-dots" aria-hidden="true">   </span>
        </div>
    </div>
    <script src="host-web.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
